<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pong - NN vs NN</title>
<style>
  body { background: #111; color: #ddd; font-family: sans-serif; text-align: center; }
  canvas { background: #000; border: 1px solid #444; }
  .controls { margin: 8px; }
  .controls > * { margin: 0 4px; vertical-align: middle; }
  #scrub { width: 420px; }
  #log { text-align: left; display: inline-block; max-width: 720px; max-height: 160px;
         overflow: auto; background: #1a1a1a; padding: 6px; font-size: 12px; }
</style>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
<h1>NN vs NN</h1>
<div class="controls">
  <button id="playPause" disabled>Pause</button>
  <button id="restart" disabled>Restart</button>
  <label>Speed
    <select id="speed">
      <option value="1">1x</option>
      <option value="2">2x</option>
      <option value="4" selected>4x</option>
      <option value="10">10x</option>
      <option value="30">30x</option>
    </select>
  </label>
  <input id="scrub" type="range" min="0" max="0" value="0" disabled>
</div>
<p id="status">Loading Python...</p>
<canvas id="board"></canvas>
<p><span style="color:#4af">nn1 (player, bottom)</span> vs <span style="color:#f64">nn2 (opponent, top)</span></p>
<pre id="log"></pre>

<script>
// Runs playgame() from opponentNN.py in the browser via Pyodide, records every
// frame, then replays the recording. Serve this folder over HTTP (python serve.py)
// and open http://localhost:8000/nnplay.html
const SCALE = 0.6;
const STEP_MS = 1000 / 60;

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const speedSel = document.getElementById("speed");
const scrub = document.getElementById("scrub");

// Wraps pong.frame_step so playgame() runs unmodified while we record each frame.
const GLUE = `
import sys
sys.path.insert(0, "/home/pyodide")
import pong
import opponentNN

meta = {}
frames = []
_frame_step = pong.frame_step

def _snap(g):
    return [float(g["ballx"]), float(g["bally"]),
            float(g["playerpaddle"]), float(g["opponentpaddle"]),
            str(g["playeraction"]), str(g["opponentaction"]), str(g["state"])]

def _recording_frame_step(game):
    if not frames:
        meta.update(width=game["width"], height=game["height"], radius=game["radius"])
        frames.append(_snap(game))
    _frame_step(game)
    frames.append(_snap(game))

pong.frame_step = _recording_frame_step

def run():
    meta.clear()
    frames.clear()
    # Same call as opponentNN's __main__
    result = opponentNN.playgame(opponentNN.new_network(6, 7, 3, 150),
                                 opponentNN.new_network(6, 7, 3, 167))
    return [meta["width"], meta["height"], meta["radius"]], frames, list(result)
`;

let match = null;   // { width, height, radius, frames, result }
let pos = 0;        // current frame index (fractional while playing)
let playing = true;

function draw() {
  const { width, height, radius, frames } = match;
  const [ballx, bally, pp, op, pact, oact, state] = frames[Math.floor(pos)];
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "#555";
  ctx.fillRect(0, 0, 1, height);
  ctx.fillRect(width - 1, 0, 1, height);

  // Paddles, using the same boxes frame_step() uses for collision
  const half = Math.floor(width / 15);
  ctx.fillStyle = "#4af";
  ctx.fillRect(pp - half, height - 30 - radius, 2 * half, radius);
  ctx.fillStyle = "#f64";
  ctx.fillRect(op - half, 30 - radius, 2 * half, radius);

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(ballx, bally, radius, 0, 2 * Math.PI);
  ctx.fill();

  const frame = Math.floor(pos);
  scrub.value = frame;
  let text = `frame ${frame}/${frames.length - 1} | nn1: ${pact} | nn2: ${oact} | state: ${state}`;
  if (frame === frames.length - 1) text += ` | result (nn1, nn2): (${match.result.join(", ")})`;
  statusEl.textContent = text;
}

function setPlaying(p) {
  playing = p;
  playPauseBtn.textContent = playing ? "Pause" : "Play";
}

playPauseBtn.onclick = () => {
  if (!playing && Math.floor(pos) >= match.frames.length - 1) pos = 0;
  setPlaying(!playing);
};
restartBtn.onclick = () => { pos = 0; setPlaying(true); draw(); };
scrub.oninput = () => { pos = Number(scrub.value); setPlaying(false); draw(); };

async function main() {
  const pyodide = await loadPyodide();
  pyodide.setStdout({ batched: msg => { logEl.textContent += msg + "\n"; } });
  pyodide.setStderr({ batched: msg => { logEl.textContent += msg + "\n"; } });
  statusEl.textContent = "Loading numpy and scipy...";
  await pyodide.loadPackage(["numpy", "scipy"]);
  for (const name of ["pong.py", "opponentNN.py"]) {
    const src = await (await fetch(name, { cache: "no-store" })).text();
    pyodide.FS.writeFile("/home/pyodide/" + name, src);
  }
  pyodide.runPython(GLUE);

  statusEl.textContent = "Simulating match...";
  await new Promise(r => setTimeout(r, 50)); // let the status repaint before blocking
  const runProxy = pyodide.globals.get("run");
  const resultProxy = runProxy();
  const [[width, height, radius], frames, result] = resultProxy.toJs();
  resultProxy.destroy();
  runProxy.destroy();
  match = { width, height, radius, frames, result };

  canvas.width = width * SCALE;
  canvas.height = height * SCALE;
  scrub.max = frames.length - 1;
  for (const el of [playPauseBtn, restartBtn, scrub]) el.disabled = false;

  let last = performance.now();
  function tick(now) {
    // rAF's timestamp can be slightly earlier than performance.now(), so clamp to >= 0
    const dt = Math.max(0, Math.min(now - last, 250));
    last = now;
    if (playing) {
      pos += (dt / STEP_MS) * Number(speedSel.value);
      if (pos >= frames.length - 1) {
        pos = frames.length - 1;
        setPlaying(false);
      }
    }
    draw();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

main().catch(err => {
  statusEl.textContent = "Error: " + err;
  console.error(err);
});
</script>
</body>
</html>
