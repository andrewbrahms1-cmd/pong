<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pong</title>
<style>
  body { background: #111; color: #ddd; font-family: sans-serif; text-align: center; }
  canvas { background: #000; border: 1px solid #444; image-rendering: pixelated; }
</style>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
<h1>Pong</h1>
<canvas id="board"></canvas>
<p id="status">Loading Python...</p>
<p>Left / Right arrow keys move your paddle (bottom).</p>

<script>
// Runs the real game logic from pong.py in the browser via Pyodide.
// Because pong.py is fetched, serve this folder over HTTP, e.g.:
//   python -m http.server   then open http://localhost:8000/pong.html

const WIDTH = 300;
const HEIGHT = 400;
const SCALE = 1.5;
const STEP_MS = 1000 / 60;

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
canvas.width = WIDTH * SCALE;
canvas.height = HEIGHT * SCALE;

// Arrow keys -> playeraction
const held = { left: false, right: false };
function playerAction() {
  if (held.left && !held.right) return "left";
  if (held.right && !held.left) return "right";
  return "";
}
function onKey(e, down) {
  if (e.key === "ArrowLeft") held.left = down;
  else if (e.key === "ArrowRight") held.right = down;
  else return;
  e.preventDefault();
}
window.addEventListener("keydown", e => onKey(e, true));
window.addEventListener("keyup", e => onKey(e, false));

// Simple opponent AI: follow the ball horizontally.
function opponentAction(s) {
  if (s.ballx < s.opponentpaddle - 2) return "left";
  if (s.ballx > s.opponentpaddle + 2) return "right";
  return "";
}

// Glue between JS and pong.py; returns plain floats so they convert cleanly.
const GLUE = `
import sys
sys.path.insert(0, "/home/pyodide")
import pong

game = None

def reset(w, h):
    global game
    game = pong.new_game(w, h, None)  # None = random seed

def step(player, opponent):
    game["playeraction"] = player or None
    game["opponentaction"] = opponent or None
    pong.frame_step(game)

def snapshot():
    return [float(game["ballx"]), float(game["bally"]), float(game["radius"]),
            float(game["playerpaddle"]), float(game["opponentpaddle"]), str(game["state"])]
`;

let py;
function snapshot() {
  const proxy = py.snapshot();
  const [ballx, bally, radius, playerpaddle, opponentpaddle, state] = proxy.toJs();
  proxy.destroy();
  return { ballx, bally, radius, playerpaddle, opponentpaddle, state };
}

function draw(s) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Side walls (columns 0 and width-1, as in render())
  ctx.fillStyle = "#555";
  ctx.fillRect(0, 0, 1, HEIGHT);
  ctx.fillRect(WIDTH - 1, 0, 1, HEIGHT);

  // Paddles, using the same boxes frame_step() uses for collision
  const half = Math.floor(WIDTH / 15);
  ctx.fillStyle = "#4af";
  ctx.fillRect(s.playerpaddle - half, HEIGHT - 30 - s.radius, 2 * half, s.radius);
  ctx.fillStyle = "#f64";
  ctx.fillRect(s.opponentpaddle - half, 30 - s.radius, 2 * half, s.radius);

  // Ball
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(s.ballx, s.bally, s.radius, 0, 2 * Math.PI);
  ctx.fill();

  statusEl.textContent = `state: ${s.state}`;
}

async function main() {
  const pyodide = await loadPyodide();
  await pyodide.loadPackage("numpy");
  const src = await (await fetch("pong.py", { cache: "no-store" })).text();
  pyodide.FS.writeFile("/home/pyodide/pong.py", src);
  pyodide.runPython(GLUE);
  py = {
    reset: pyodide.globals.get("reset"),
    step: pyodide.globals.get("step"),
    snapshot: pyodide.globals.get("snapshot"),
  };
  py.reset(WIDTH, HEIGHT);

  let state = snapshot();
  let last = performance.now();
  let acc = 0;
  function frame(now) {
    acc = Math.min(acc + now - last, 250); // don't fast-forward after a hidden tab
    last = now;
    while (acc >= STEP_MS) {
      py.step(playerAction(), opponentAction(state));
      state = snapshot();
      acc -= STEP_MS;
    }
    draw(state);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

main().catch(err => {
  statusEl.textContent = "Error: " + err;
  console.error(err);
});
</script>
</body>
</html>
